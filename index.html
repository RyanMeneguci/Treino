<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treino</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1b2a29;--mut:#5e7072;--line:#d3dbd7;--ac:#0f5c5a;--onac:#fff;--ok:#f2c94c;--bad:#b3392f;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#111918;--card:#1a2423;--ink:#e8eeec;--mut:#8fa3a1;--line:#2c3a38;--ac:#5fc4bd;--onac:#0c1b1a;--bad:#ef8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;min-width:48px;height:44px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:18px;font-weight:700;padding:0 14px}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.tab.add{color:var(--mut);border-style:dashed}
#prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
#bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
main{padding:12px;max-width:640px;margin:0 auto}
.ex{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.ex.fin{border-left-color:var(--ac)}
.ex.fin h3{color:var(--mut)}
.ex h3{margin:0 0 2px;font-size:18px}
.meta{margin:0;color:var(--mut);font-size:14px}
.note{margin:6px 0 0;font-size:14px;white-space:pre-wrap}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:17px;font-weight:700}
.set.on{background:var(--ok);border-color:var(--ok);color:#2a2200}
.tools{display:flex;gap:6px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.tools button,.bar button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px}
.tools .del{color:var(--bad);margin-left:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.bar .pri{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
input,textarea{width:100%;margin-top:3px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.act button{height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px}
.act .pri{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:700}
.plus{margin:10px 0 6px;color:var(--ac);font-weight:700;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16px;margin-top:14px}
.chk input{width:22px;height:22px;margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div id="tabs"></div>
  <div id="prog"><span id="cnt"></span><div id="bar"><i></i></div></div>
</header>
<main>
  <div id="list"></div>
  <div class="bar" id="foot"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="f" onsubmit="return false">
    <label>Exercício<input id="fn" required placeholder="Supino inclinado"></label>
    <div class="row">
      <label>Séries<input id="fs" type="number" min="1" max="30" inputmode="numeric" value="3"></label>
      <label>Intervalo<input id="fi" placeholder="1'"></label>
    </div>
    <div class="row">
      <label>Repetições<input id="fr" placeholder="10"></label>
      <label>Carga (kg)<input id="fl" placeholder="30"></label>
    </div>
    <label class="chk"><input type="checkbox" id="fb">Bi-série (dois exercícios seguidos)</label>
    <div id="bg" hidden>
      <label>Segundo exercício<input id="fbn" placeholder="Crucifixo inclinado"></label>
      <div class="row">
        <label>Repetições<input id="fbr" placeholder="10"></label>
        <label>Carga (kg)<input id="fbl" placeholder="10"></label>
      </div>
    </div>
    <label>Observação<textarea id="fo" rows="3" placeholder="Drop set na última série"></textarea></label>
    <div class="act"><button type="button" id="fc">Cancelar</button><button class="pri" type="submit" id="fok">Salvar</button></div>
  </form>
</dialog>

<script>
const K='treino-app-v2';
let n_=0;
const E=(name,sets,reps,load,rest,note,b)=>({id:'s'+(++n_),name,sets,reps,load,rest,note:note||'',b:b||null,done:Array(sets).fill(false)});
const B=(name,reps,load)=>({name,reps,load});
const seed=()=>({cur:0,days:[
{id:1,name:'A Seg',ex:[
E(`Supino Máquina Inclinado`,5,`2x10 + 3x10`,`20 e 40`,`1'`,`2x10 de aquecimento + 3 séries de carga`),
E(`Banco Supino Inclinado`,3,`10`,`30`,`1'`,`Drop set na última série: faz supino, faz crucifixo e diminui a carga`,B(`Crucifixo Inclinado com Halteres`,`10`,`10`)),
E(`Crossover Polia Alta`,4,`12`,`25`,`1'`),
E(`Elevação Lateral 10/8/6/4 +10`,3,`10/8/6/4`,`8`,`1'`,`10 reps, descansa 10s, +8, 10s, +6, 10s, +4, 10s, diminui a carga e faz 10`),
E(`Elevação Lateral Máquina`,4,`12`,`5`,`1'`),
E(`Tríceps Polia com Barra Reta`,4,`10`,`50`,`45"`,``,B(`Tríceps Testa Barra Reta`,`10`,`50`)),
E(`Tríceps Corda Unilateral`,3,`10`,`30`,`1'`),
E(`Abdominal Máquina`,4,`12`,`20`,`1'`)]},
{id:2,name:'B Ter',ex:[
E(`Puxada Fechada Barra Reta`,4,`15x12x10x8`,`30 40 50 60`,`1'`,`1x15 / 1x12 / 1x10 / 1x8`),
E(`Puxada Neutra Triângulo`,3,`12`,`100`,`1'`,``,B(`Pulldown com Corda`,`12`,`35`)),
E(`Pull Around`,3,`10`,`40`,`1'`),
E(`Face Pull`,3,`10`,`60`,`1'`),
E(`Crucifixo Inverso Halteres`,3,`10`,`10`,`1'`),
E(`Rosca Scott com Barra Reta`,4,`15x12x10-10-10`,`20`,`1'`,`1x15 / 1x12 / 1x10-10-10, drop set na última série`),
E(`Rosca Direta Banco Inclinado`,4,`10`,``,`2'`,`Intervalo de 2' no primeiro e 1' no segundo`,B(`Rosca Direta Sentada com Halteres`,`10`,``))]},
{id:3,name:'C Qua',ex:[
E(`Agachamento Livre com Barra`,5,`10`,``,`2'`,`2x10 de aquecimento + 3x10`),
E(`Leg 45º`,6,`10`,``,`1'`,`Progressão de carga`),
E(`Cadeira Extensora`,18,`8x10x12`,`35`,`2'`,`8x8 / 6x10 / 4x12, com 10s de intervalo entre as séries; descansa 2 min`),
E(`Agachamento Hack`,3,`10`,``,`45"`,`Focar na amplitude`),
E(`Cadeira Flexora`,3,`10`,`100`,`2'`),
E(`Panturrilha no Leg Horizontal ou em Pé`,4,`MAX`,``,`45"`)]},
{id:4,name:'D Qui',ex:[
E(`Crossover Medial Banco`,4,`20x15x12x10`,``,`1'`,`1x20 / 1x15 / 1x12 / 1x10-10-10; progressão de carga e drop set`),
E(`Supino Reto`,5,`10x10-10-21`,``,`1'`,`2x10 aquecimento / 2x10 pesado / 1x10, diminui a carga, 10, diminui e faz 21 curtas`),
E(`Supino Máquina Inclinada`,3,`10`,``,`1'`),
E(`Desenvolvimento`,4,`10`,`20`,`1'`),
E(`Elevação Lateral Unilateral na Polia Baixa Neutra`,3,`12`,``,`2'`),
E(`Tríceps na Polia com Barra Reta`,4,`10`,``,`45"`,`Intervalo de 45" no primeiro e 1' no segundo`,B(`Tríceps Testa na Polia com Barra Reta`,`10`,``)),
E(`Tríceps Francês Sentado com Halteres`,4,`10`,`35`,`1'`)]},
{id:5,name:'E Sex',ex:[
E(`Remada Serrote Halteres`,3,`12`,`20`,`1'`),
E(`Remada Curvada com Barra Reta`,4,`10`,`20`,`1'`),
E(`Remada Baixa (pronada)`,4,`15x12x10`,`25-35-45`,`1'`,`1x15 / 1x12 / 1x10 / 1x10-10-10; progressão de carga, drop set na última`),
E(`Face Pull`,3,`10`,`45`,`1'`),
E(`Remada Alta no Smith`,3,`10`,``,`2'`),
E(`Rosca Direta Barra Reta`,10,`10`,`10`,`45"`),
E(`Rosca Polia Alta Unilateral`,4,`10`,`15`,`1'`)]}
]});
let S=null,edit=false,editing=null;
const ok=x=>x&&Array.isArray(x.days)&&x.days.length;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!ok(S)){let o=null;try{o=JSON.parse(localStorage.getItem('treino-app-v1'))}catch(e){}S=ok(o)&&o.days.some(d=>d.ex&&d.ex.length)?o:seed()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const day=()=>S.days[S.cur];
const fin=e=>e.done.length>0&&e.done.every(Boolean);

function render(){
  if(S.cur>=S.days.length)S.cur=0;
  const d=day();
  $('#tabs').innerHTML=S.days.map((x,i)=>`<button class="tab${i===S.cur?' on':''}" data-a="day" data-i="${i}">${esc(x.name)}</button>`).join('')+'<button class="tab add" data-a="addday" aria-label="Novo dia">+</button>';
  const n=d.ex.length,k=d.ex.filter(fin).length;
  $('#cnt').textContent=n?`${k} de ${n} exercícios`:'Sem exercícios';
  $('#bar i').style.width=n?(k/n*100)+'%':'0';
  $('#list').innerHTML=n?d.ex.map((e,i)=>{
    const part=(t,r,l)=>`<h3>${esc(t)}</h3><p class="meta">${[r&&esc(r)+' reps',l&&esc(l)+' kg'].filter(Boolean).join(' · ')||'&nbsp;'}</p>`;
    const meta=[`${e.sets} séries`,e.rest&&`intervalo ${esc(e.rest)}`].filter(Boolean).join(' · ');
    return `<article class="ex${fin(e)?' fin':''}">${part(e.name,e.reps,e.load)}${e.b?`<div class="plus">+ bi-série</div>`+part(e.b.name,e.b.reps,e.b.load):''}<p class="meta">${meta}</p>${e.note?`<p class="note">${esc(e.note)}</p>`:''}
    <div class="sets">${e.done.map((v,j)=>`<button class="set${v?' on':''}" data-a="set" data-e="${e.id}" data-s="${j}" aria-pressed="${v}" aria-label="Série ${j+1}">${j+1}</button>`).join('')}</div>
    ${edit?`<div class="tools"><button data-a="up" data-e="${e.id}" ${i===0?'disabled':''} aria-label="Subir">↑</button><button data-a="dn" data-e="${e.id}" ${i===n-1?'disabled':''} aria-label="Descer">↓</button><button data-a="ed" data-e="${e.id}">Editar</button><button class="del" data-a="rm" data-e="${e.id}">Excluir</button></div>`:''}</article>`;
  }).join(''):`<div class="empty">Nenhum exercício no treino ${esc(d.name)}.<br>Toque em “Editar treino” para cadastrar.</div>`;
  $('#foot').innerHTML=edit
    ?'<button class="pri" data-a="new">+ Exercício</button><button data-a="ren">Renomear dia</button><button data-a="rmday">Excluir dia</button><button data-a="exp">Copiar backup</button><button data-a="imp">Restaurar backup</button><button data-a="done">Concluir edição</button>'
    :'<button class="pri" data-a="reset">Zerar checks</button><button data-a="edit">Editar treino</button>';
}

function openForm(e){
  editing=e||null;
  $('#fn').value=e?e.name:'';$('#fs').value=e?e.sets:3;$('#fi').value=e?e.rest:'';
  $('#fr').value=e?e.reps:'';$('#fl').value=e?e.load:'';$('#fo').value=e?e.note:'';
  const b=e&&e.b;$('#fb').checked=!!b;$('#fbn').value=b?b.name:'';$('#fbr').value=b?b.reps:'';$('#fbl').value=b?b.load:'';$('#bg').hidden=!b;
  $('#dlg').showModal();$('#fn').focus();
}
function saveForm(){
  const name=$('#fn').value.trim();if(!name){$('#fn').focus();return}
  const sets=Math.min(30,Math.max(1,parseInt($('#fs').value)||1));
  const b=$('#fb').checked?{name:$('#fbn').value.trim(),reps:$('#fbr').value.trim(),load:$('#fbl').value.trim()}:null;
  if(b&&!b.name){$('#fbn').focus();return}
  const o={name,sets,rest:$('#fi').value.trim(),reps:$('#fr').value.trim(),load:$('#fl').value.trim(),note:$('#fo').value.trim(),b};
  if(editing){Object.assign(editing,o);editing.done=Array.from({length:sets},(_,i)=>!!editing.done[i])}
  else day().ex.push({id:uid(),...o,done:Array(sets).fill(false)});
  save();$('#dlg').close();render();
}
$('#f').addEventListener('submit',saveForm);
$('#fc').onclick=()=>$('#dlg').close();
$('#fb').onchange=()=>{$('#bg').hidden=!$('#fb').checked};

function move(id,dir){const a=day().ex,i=a.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=day(),e=d.ex.find(x=>x.id===b.dataset.e);
  if(a==='day')S.cur=+b.dataset.i;
  else if(a==='addday'){const n=prompt('Nome do novo dia (ex.: F)');if(!n||!n.trim())return;S.days.push({id:uid(),name:n.trim(),ex:[]});S.cur=S.days.length-1}
  else if(a==='set'){e.done[+b.dataset.s]=!e.done[+b.dataset.s];if(navigator.vibrate)navigator.vibrate(15)}
  else if(a==='reset'){if(!confirm('Zerar todos os checks do treino '+d.name+'?'))return;d.ex.forEach(x=>x.done=x.done.map(()=>false))}
  else if(a==='edit')edit=true;
  else if(a==='done')edit=false;
  else if(a==='new'){openForm();return}
  else if(a==='ed'){openForm(e);return}
  else if(a==='up')move(b.dataset.e,-1);
  else if(a==='dn')move(b.dataset.e,1);
  else if(a==='rm'){if(!confirm('Excluir “'+e.name+'”?'))return;d.ex=d.ex.filter(x=>x!==e)}
  else if(a==='ren'){const n=prompt('Novo nome do dia',d.name);if(!n||!n.trim())return;d.name=n.trim()}
  else if(a==='rmday'){if(S.days.length<2){alert('Mantenha pelo menos um dia.');return}if(!confirm('Excluir o treino '+d.name+' inteiro?'))return;S.days.splice(S.cur,1);S.cur=0}
  else if(a==='exp'){const j=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(j).then(()=>alert('Backup copiado. Cole em um bloco de notas ou mensagem para guardar.'),()=>prompt('Copie o backup:',j))}else prompt('Copie o backup:',j);return}
  else if(a==='imp'){const t=prompt('Cole o backup aqui');if(!t)return;try{const p=JSON.parse(t);if(!Array.isArray(p.days))throw 0;S=p;S.cur=0}catch(x){alert('Backup inválido.');return}}
  save();render();
});
render();
</script>
</body>
</html>
